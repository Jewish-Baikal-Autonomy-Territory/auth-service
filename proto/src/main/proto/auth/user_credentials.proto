syntax = "proto3";

import "google/api/field_behavior.proto";

package auth;

option java_multiple_files = true;
option java_package = "org.example.ai_auth_service.proto.auth";
option go_package = "github.com/Jewish-Baikal-Autonomy-Territory/auth-service/internal/api/grpc/auth";

message UserCredentials {
  string email = 1 [
    json_name = "email",
    (google.api.field_behavior) = REQUIRED
  ];

  string password = 2 [
    json_name = "password",
    (google.api.field_behavior) = REQUIRED
  ];
}